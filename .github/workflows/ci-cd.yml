name: CI/CD
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo libclippy -- -D warnings
      # The smallest part: the x4 pin map and small-package gates.
      - run: cargo clippy --features gd32e230f4xx -- -D warnings
      - run: cargo lib
      - run: cargo examplesclippy -- -D warnings
      - run: cargo examples
      - run: cargo doc --no-deps --target thumbv8m.base-none-eabi --features defmt,gd32e230c8xx
        env:
          RUSTDOCFLAGS: -D warnings

  # Publishes when the version in Cargo.toml is not on crates.io yet, then tags
  # the commit. Login is crates.io Trusted Publishing: it names this file, so a
  # rename has to be repeated in the crate settings there.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: write
      id-token: write
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sf https://index.crates.io/gd/32/gd32e2-hal | jq -r .vers | grep -qx "$version"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.version.outputs.new == 'true'
        run: cargo publish --features gd32e230c8xx
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  # Per-part documentation on GitHub Pages, deployed with each release so it
  # matches the version on crates.io. A manual run deploys the commit it is run
  # on — for the first deployment and for retrying a failed one.
  pages:
    needs: [check, publish]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.publish.outputs.new == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Nightly for -Zrustdoc-map only; everything else stays on the pinned
      # toolchain.
      - run: rustup toolchain install nightly --profile minimal --target thumbv8m.base-none-eabi
      - run: bash scripts/pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages
      - id: deploy
        uses: actions/deploy-pages@v4
